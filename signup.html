
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SUJAN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="index.html">SUJAN<span> Software Solutions</span></a>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
        <a class="nav-button active" href="signup.html">Sign Up</a>
        <a href="courses.html">Courses</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="gallery.html">Gallery & Map</a>
    </nav>
</header>

<main class="auth-main">
    <form id="signupForm" class="auth-card">
        <div class="auth-logo">&lt;/&gt;</div>
        <span class="eyebrow">JOIN SUJAN</span>
        <h1>Create an account</h1>
        <p class="muted">Register to access the demo website.</p>

        <label for="signupName">Full Name</label>
        <input id="signupName" type="text" autocomplete="name"
               placeholder="Enter your name" required maxlength="100">

        <label for="signupEmail">Email Address</label>
        <input id="signupEmail" type="email" autocomplete="email"
               placeholder="Enter email" required maxlength="150">

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password"
               autocomplete="new-password"
               placeholder="At least 8 characters" minlength="8" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password"
               autocomplete="new-password"
               placeholder="Re-enter password" minlength="8" required>

        <button class="btn btn-full" type="submit">Create Account</button>
        <p id="signupStatus" class="status" role="status"></p>

        <p class="auth-bottom">Already have an account?
            <a href="login.html">Login</a>
        </p>
        <a class="back-link" href="index.html">← Back to Home</a>
    </form>
</main>

<footer class="footer">
    <p>© 2026 SUJAN Software Solutions.</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
