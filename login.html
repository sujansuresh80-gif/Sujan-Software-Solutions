
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SUJAN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="index.html">SUJAN<span> Software Solutions</span></a>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a class="active" href="login.html">Login</a>
        <a class="nav-button" href="signup.html">Sign Up</a>
        <a href="courses.html">Courses</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="gallery.html">Gallery & Map</a>
    </nav>
</header>

<main class="auth-main">
    <form id="loginForm" class="auth-card">
        <div class="auth-logo">&lt;/&gt;</div>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to your account</h1>
        <p class="muted">Enter your registered email and password.</p>

        <label for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" autocomplete="username"
               placeholder="Enter email" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
               autocomplete="current-password"
               placeholder="Enter password" required>

        <button class="btn btn-full" type="submit">Login</button>
        <p id="loginStatus" class="status" role="status"></p>

        <p class="auth-bottom">Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
        <a class="back-link" href="index.html">← Back to Home</a>
    </form>
</main>

<footer class="footer">
    <p>© 2026 SUJAN Software Solutions.</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
